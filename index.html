let renderer, scene, camera, raycaster, pointer;
let meshList = [], booted=false;
let selectedStruct=null, selectedRegion=null, hoverRegion=null, isolate=false;

const canvasWrap=document.getElementById('canvasWrap');
const tooltip=document.getElementById('tooltip');
const labelsBox=document.getElementById('labels');
const clipPlane = new THREE.Plane(new THREE.Vector3(-1,0,0), 3.0);

function wrinkle(geo, amp, freq, seed, folds){
  const pos=geo.attributes.position, t=new THREE.Vector3();
  for(let i=0;i<pos.count;i++){
    t.fromBufferAttribute(pos,i);
    let d;
    if(folds){ d=1+amp*(Math.sin(t.y*freq*3+seed)*0.6+Math.sin(t.x*freq*1.5)*0.15); }
    else{
      const n1=Math.sin(t.x*freq+seed)*Math.cos(t.y*freq*1.3+seed)*Math.sin(t.z*freq*0.8+seed);
      const n2=Math.sin(t.x*freq*2.1+seed*2)*Math.sin(t.z*freq*1.7+seed);
      d=1+amp*(n1*0.62+n2*0.38);
    }
    t.multiplyScalar(d); pos.setXYZ(i,t.x,t.y,t.z);
  }
  geo.computeVertexNormals();
}
function lobeGeo(rx,ry,rz,seed,folds){
  const g=new THREE.SphereGeometry(1,46,34);
  wrinkle(g, folds?0.12:0.14, folds?2.4:3.0, seed, folds);
  g.scale(rx,ry,rz); return g;
}
function mat(color){
  return new THREE.MeshStandardMaterial({
    color:new THREE.Color(color), roughness:0.62, metalness:0.05,
    emissive:new THREE.Color(color), emissiveIntensity:0,
    transparent:true, opacity:1, side:THREE.DoubleSide,
    clippingPlanes:[clipPlane], clipShadows:true
  });
}
function reg(regKey, mesh){ mesh.userData.region=regKey; meshList.push(mesh); REGIONS[regKey]._meshes.push(mesh); }

function buildRegion(key){
  const R=REGIONS[key]; R._meshes=[];
  const g=new THREE.Group(); g.position.set(R.home[0],R.home[1],R.home[2]); R._group=g;
  const c=R.color, seed=key.length*1.7+0.6;

  if(R.build==='lobe'){
    const m=new THREE.Mesh(lobeGeo(R.dims[0],R.dims[1],R.dims[2],seed,0), mat(c)); g.add(m); reg(key,m);
  } else if(R.build==='temporal'){
    for(const sx of [1,-1]){
      const m=new THREE.Mesh(lobeGeo(0.72,0.72,1.35,seed+sx,0), mat(c));
      m.position.set(sx*1.25,0,0.1); g.add(m); reg(key,m);
    }
  } else if(R.build==='folds'){
    const m=new THREE.Mesh(lobeGeo(R.dims[0],R.dims[1],R.dims[2],seed,1), mat(c)); g.add(m); reg(key,m);
  } else if(R.build==='cingulate'){
    const geo=new THREE.TorusGeometry(0.95,0.1,14,60,Math.PI*1.15);
    const m=new THREE.Mesh(geo, mat(c)); m.rotation.y=Math.PI/2; m.rotation.z=-Math.PI*0.5;
    m.scale.set(1,0.7,1.5); g.add(m); reg(key,m);
  } else if(R.build==='insula'){
    for(const sx of [1,-1]){
      const geo=new THREE.SphereGeometry(1,26,20); geo.scale(0.34,0.5,0.6);
      const m=new THREE.Mesh(geo, mat(c)); m.position.set(sx*0.78,-0.05,0); g.add(m); reg(key,m);
    }
  } else if(R.build==='stem'){
    const m=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.2,1.5,22,5), mat(c)); m.rotation.x=-0.18; g.add(m); reg(key,m);
    const pons=new THREE.Mesh(new THREE.SphereGeometry(0.4,22,16), mat(c)); pons.position.set(0,0.35,0.16); pons.scale.set(1,0.7,0.8); g.add(pons); reg(key,pons);
    for(const sy of [0.62,0.44]) for(const sx of [1,-1]){ // colículos
      const cc=new THREE.Mesh(new THREE.SphereGeometry(0.13,16,12), mat(c)); cc.position.set(sx*0.15,sy,-0.28); g.add(cc); reg(key,cc);
    }
  } else if(R.build==='thal'){
    for(const sx of [1,-1]){
      const geo=new THREE.SphereGeometry(1,28,22); geo.scale(0.42,0.5,0.62);
      const m=new THREE.Mesh(geo, mat(c)); m.position.set(sx*0.36,0,0); g.add(m); reg(key,m);
    }
  } else if(R.build==='small'){
    const geo=new THREE.SphereGeometry(0.34,24,18);
    const m=new THREE.Mesh(geo, mat(c)); g.add(m); reg(key,m);
  } else if(R.build==='ganglia'){
    for(const sx of [1,-1]){
      const put=new THREE.Mesh((()=>{const gg=new THREE.SphereGeometry(1,24,18);gg.scale(0.24,0.42,0.5);return gg;})(), mat(c));
      put.position.set(sx*0.66,0.02,0.1); g.add(put); reg(key,put);
      const cau=new THREE.Mesh((()=>{const gg=new THREE.SphereGeometry(1,20,16);gg.scale(0.2,0.3,0.36);return gg;})(), mat(c));
      cau.position.set(sx*0.42,0.28,0.45); g.add(cau); reg(key,cau);
      const gp=new THREE.Mesh((()=>{const gg=new THREE.SphereGeometry(1,18,14);gg.scale(0.15,0.34,0.4);return gg;})(), mat('#f6b93b'));
      gp.position.set(sx*0.5,0,0.08); g.add(gp); reg(key,gp);
    }
  } else if(R.build==='limbic'){
    const curve=new THREE.CatmullRomCurve3([
      new THREE.Vector3(0,0.3,0.45),new THREE.Vector3(0.14,0.28,0.05),
      new THREE.Vector3(0.05,0.1,-0.35),new THREE.Vector3(-0.08,-0.14,-0.5),new THREE.Vector3(-0.02,-0.32,-0.2)]);
    for(const sx of [1,-1]){
      const hip=new THREE.Mesh(new THREE.TubeGeometry(curve,54,0.12,10,false), mat(c));
      hip.position.set(sx*0.9,-0.02,0.05); hip.scale.x=sx; g.add(hip); reg(key,hip);
      const amy=new THREE.Mesh((()=>{const gg=new THREE.SphereGeometry(0.22,20,16);gg.scale(1,0.85,1.2);return gg;})(), mat('#ff7f9c'));
      amy.position.set(sx*0.95,0.02,0.72); g.add(amy); reg(key,amy);
    }
  } else if(R.build==='white'){
    const cc=new THREE.Mesh(new THREE.TorusGeometry(0.92,0.11,14,54,Math.PI*1.1), mat(c));
    cc.rotation.y=Math.PI/2; cc.rotation.z=-Math.PI*0.56; cc.scale.set(1,0.5,1.35); g.add(cc); reg(key,cc);
    const fx=new THREE.Mesh(new THREE.TorusGeometry(0.55,0.05,10,40,Math.PI*0.9), mat('#a8e063'));
    fx.rotation.y=Math.PI/2; fx.rotation.z=-Math.PI*0.35; fx.position.set(0,-0.2,-0.1); g.add(fx); reg(key,fx);
  } else if(R.build==='tiny'){
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.13,16,12), mat(c)); g.add(m); reg(key,m);
  } else if(R.build==='pituitary'){
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.16,18,14), mat(c)); g.add(m); reg(key,m);
    const stalk=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.34,8), mat(c)); stalk.position.set(0,0.24,0); g.add(stalk); reg(key,stalk);
  }
  return g;
}

function initScene(){
  renderer=new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(canvasWrap.clientWidth, canvasWrap.clientHeight);
  renderer.localClippingEnabled=true;
  canvasWrap.appendChild(renderer.domElement);

  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(42, canvasWrap.clientWidth/canvasWrap.clientHeight, 0.1, 100);
  scene.add(new THREE.AmbientLight(0xb9c6ff,0.6));
  const k=new THREE.DirectionalLight(0xffffff,1.1); k.position.set(4,6,6); scene.add(k);
  const f=new THREE.DirectionalLight(0x8fb0ff,0.55); f.position.set(-6,1,-4); scene.add(f);
  const r=new THREE.DirectionalLight(0xff9edb,0.5); r.position.set(0,-5,-6); scene.add(r);

  const brain=new THREE.Group();
  Object.keys(REGIONS).forEach(k=> brain.add(buildRegion(k)));
  scene.add(brain);

  raycaster=new THREE.Raycaster(); pointer=new THREE.Vector2();
  buildLabels();
  updateCamera(); bindControls();
  booted=true; document.getElementById('overlay').style.display='none';
  animate();
}

/* ---- cámara órbita ---- */
const target=new THREE.Vector3(0,-0.1,0);
let radius=9.4, theta=0.62, phi=1.25, spin=false, dragging=false, downX=0,downY=0,moved=0;
function updateCamera(){
  const sp=Math.sin(phi);
  camera.position.set(target.x+radius*sp*Math.sin(theta), target.y+radius*Math.cos(phi), target.z+radius*sp*Math.cos(theta));
  camera.lookAt(target);
}
function bindControls(){
  const el=renderer.domElement;
  el.addEventListener('pointerdown',e=>{dragging=true;moved=0;downX=e.clientX;downY=e.clientY;el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointermove',e=>{
    const r=el.getBoundingClientRect();
    pointer.x=((e.clientX-r.left)/r.width)*2-1; pointer.y=-((e.clientY-r.top)/r.height)*2+1;
    if(dragging){const dx=e.clientX-downX,dy=e.clientY-downY;moved+=Math.abs(dx)+Math.abs(dy);
      theta-=dx*0.006;phi-=dy*0.006;phi=Math.max(0.25,Math.min(Math.PI-0.25,phi));downX=e.clientX;downY=e.clientY;updateCamera();}
    else hoverTest(e);
  });
  el.addEventListener('pointerup',()=>{dragging=false; if(moved<7) clickTest();});
  el.addEventListener('pointerleave',()=>{setHover(null);tooltip.style.opacity=0;});
  el.addEventListener('wheel',e=>{e.preventDefault();radius*=(1+e.deltaY*0.0011);radius=Math.max(4.5,Math.min(20,radius));updateCamera();},{passive:false});
}
function hoverTest(e){
  raycaster.setFromCamera(pointer,camera);
  const hit=raycaster.intersectObjects(meshList,false)[0];
  if(hit){
    const rk=hit.object.userData.region; setHover(rk);
    const r=renderer.domElement.getBoundingClientRect();
    tooltip.textContent=REGIONS[rk].label;
    tooltip.style.left=(e.clientX-r.left)+'px'; tooltip.style.top=(e.clientY-r.top)+'px'; tooltip.style.opacity=1;
    renderer.domElement.style.cursor='pointer';
  }else{ setHover(null); tooltip.style.opacity=0; renderer.domElement.style.cursor=dragging?'grabbing':'grab'; }
}
function clickTest(){
  raycaster.setFromCamera(pointer,camera);
  const hit=raycaster.intersectObjects(meshList,false)[0];
  if(hit) selectRegion(hit.object.userData.region);
}
function setHover(rk){ if(hoverRegion===rk)return; hoverRegion=rk; refreshEmissive(); }
function refreshEmissive(){
  for(const k in REGIONS){
    const R=REGIONS[k]; if(!R._meshes)continue;
    const on=(k===selectedRegion)?0.55:(k===hoverRegion?0.28:0.0);
    const op=(isolate && selectedRegion && k!==selectedRegion)?0.12:1.0;
    R._meshes.forEach(m=>{m.material.emissiveIntensity=on;m.material.opacity=op;});
  }
}

/* ---- etiquetas ---- */
let labelsOn=false; const labelEls={};
function buildLabels(){
  for(const k in REGIONS){
    const d=document.createElement('div'); d.className='lbl3d'; d.textContent=REGIONS[k].label;
    d.style.display='none'; labelsBox.appendChild(d); labelEls[k]=d;
  }
}
function updateLabels(){
  if(!labelsOn)return;
  const w=canvasWrap.clientWidth,h=canvasWrap.clientHeight, v=new THREE.Vector3();
  for(const k in REGIONS){
    const R=REGIONS[k]; v.copy(R._group.position); v.project(camera);
    const el=labelEls[k];
    if(v.z<1){ el.style.display='block'; el.style.left=((v.x*0.5+0.5)*w)+'px'; el.style.top=((-v.y*0.5+0.5)*h)+'px'; }
    else el.style.display='none';
  }
}

/* ---- desarme + corte ---- */
let explodeTarget=0, explode=0;
const slider=document.getElementById('explode');
function animate(){
  requestAnimationFrame(animate);
  if(spin&&!dragging){theta+=0.0028;updateCamera();}
  explode+=(explodeTarget-explode)*0.09;
  for(const k in REGIONS){const R=REGIONS[k];
    R._group.position.set(R.home[0]+R.dir[0]*explode, R.home[1]+R.dir[1]*explode, R.home[2]+R.dir[2]*explode);}
  updateLabels();
  renderer.render(scene,camera);
}
slider.addEventListener('input',()=>explodeTarget=slider.value/100);
document.getElementById('btnArmar').onclick=()=>{explodeTarget=0;slider.value=0;};
document.getElementById('btnDesarmar').onclick=()=>{explodeTarget=1;slider.value=100;};
document.getElementById('btnSpin').onclick=e=>{spin=!spin;e.target.classList.toggle('active',spin);};
document.getElementById('btnReset').onclick=()=>{radius=9.4;theta=0.62;phi=1.25;updateCamera();};
document.getElementById('btnLabels').onclick=e=>{labelsOn=!labelsOn;e.target.classList.toggle('active',labelsOn);
  if(!labelsOn)for(const k in labelEls)labelEls[k].style.display='none';};

const clip=document.getElementById('clip'), clipAxis=document.getElementById('clipAxis');
function applyClip(){
  const ax=clipAxis.value, t=clip.value/100; // 1 = sin corte
  const n={x:new THREE.Vector3(-1,0,0),y:new THREE.Vector3(0,-1,0),z:new THREE.Vector3(0,0,-1)}[ax];
  clipPlane.normal.copy(n);
  clipPlane.constant = -2.4 + t*4.8; // de -2.4 (todo cortado) a 2.4 (nada)
}
clip.addEventListener('input',applyClip); clipAxis.addEventListener('change',applyClip); applyClip();

  b.innerHTML=`<span class="d" style="background:${c.color}"></span>${c.label.split(' y ')[0]}`;

});
function syncFilters(){ filtersEl.querySelectorAll('.fchip').forEach(f=>{
  const on=f.dataset.cat===activeCat; f.classList.toggle('on',on);

});}

let regionFilter=null;
function norm(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function filtered(){
  const q=norm(query);
  return STRUCTURES.filter(s=>{
    if(activeCat && s.cat!==activeCat) return false;
    if(regionFilter && s.region3d!==regionFilter) return false;
    if(q && !(norm(s.name).includes(q)||norm(s.def).includes(q)||norm(s.fun).includes(q))) return false;
    return true;
  });
}
function renderList(){
  const items=filtered();
  listCount.textContent=`${items.length} de ${STRUCTURES.length}`;
  // agrupa por categoría
  const groups={};
  items.forEach(s=>{(groups[s.cat]=groups[s.cat]||[]).push(s);});
  listEl.innerHTML='';
  Object.keys(CATS).forEach(catKey=>{
    const arr=groups[catKey]; if(!arr||!arr.length)return;
    const h=document.createElement('div'); h.className='groupHdr'; h.textContent=CATS[catKey].label; listEl.appendChild(h);
    arr.forEach(s=>{
      const row=document.createElement('div'); row.className='row'+(selectedStruct&&selectedStruct.id===s.id?' sel':''); row.dataset.id=s.id;
      row.innerHTML=`<span class="d" style="background:${CATS[s.cat].color}"></span>
        <div><div class="nm">${s.name}</div><div class="sub">${REGIONS[s.region3d]?REGIONS[s.region3d].label:regionName(s.region3d)}</div></div>`;
      row.onclick=()=>selectStructure(s.id,true);
      listEl.appendChild(row);
    });
  });
  if(!items.length){ listEl.innerHTML='<div style="padding:24px;text-align:center;color:var(--muted2)">Sin resultados. Prueba otra búsqueda.</div>'; }
}
function regionName(rk){return {pares:'Pares craneales',periferico:'Sistema endocrino periférico',meninges:'Meninges',ventriculos:'Sistema ventricular',medula:'Médula espinal',olfatorio:'Sistema olfatorio'}[rk]||rk;}

const fichaCard=document.getElementById('fichaCard');
function structuresInRegion(rk){return STRUCTURES.filter(s=>s.region3d===rk);}

function selectRegion(rk){
  selectedRegion=rk; selectedStruct=null; refreshEmissive();
  regionFilter=rk; activeCat=null; query=''; searchEl.value=''; syncFilters(); renderList();
  const R=REGIONS[rk], arr=structuresInRegion(rk);

    <span class="catbadge" style="background:${hexa(R.color,.18)};color:${R.color}">Región 3D</span>
    <h3 style="color:${R.color}">${R.label}</h3>

    <div class="regchips">${arr.map(s=>`<button class="rchip" data-id="${s.id}">${s.name}</button>`).join('')}</div>`;
  fichaCard.classList.add('show');
  fichaCard.querySelector('.x').onclick=closeFicha;

}
function selectStructure(id, fromList){

  selectedStruct=s; selectedRegion=REGIONS[s.region3d]?s.region3d:null; refreshEmissive();
  const col=CATS[s.cat].color;

  fichaCard.innerHTML=`<button class="x" title="Cerrar">×</button>
    <span class="catbadge" style="background:${hexa(col,.18)};color:${col}">${CATS[s.cat].label}</span>
    <h3 style="color:${col}">${s.name}</h3>
    <div class="fblock"><div class="l">📍 Qué es</div><p>${s.def}</p></div>
    <div class="fblock"><div class="l">⚙️ Función</div><p>${s.fun}</p></div>
    <div class="fblock les"><div class="l">⚠️ Si se lesiona…</div><p>${s.les}</p></div>
    <div class="fichaActions">
      ${noMesh?'<span style="color:var(--muted2);font-size:12px">Sin representación 3D (estructura periférica)</span>'
        :`<button class="btn sm" id="isoBtn">${isolate?'Mostrar todo':'Aislar en 3D'}</button>
          <button class="btn sm" id="regBtn">Ver región</button>`}
    </div>`;
  fichaCard.classList.add('show');
  fichaCard.querySelector('.x').onclick=closeFicha;

/* Bibliografía real de referencia (manuales estándar de neuroanatomía). */
const SOURCES = [
  {key:'kandel', full:'Kandel ER, Schwartz JH, Jessell TM, Siegelbaum SA, Hudspeth AJ. <i>Principios de Neurociencia</i> (Principles of Neural Science). 5.ª ed. McGraw-Hill; 2013.'},
  {key:'purves', full:'Purves D, Augustine GJ, Fitzpatrick D, et al. <i>Neuroscience</i>. 6.ª ed. Oxford University Press / Sinauer; 2018.'},
  {key:'snell', full:'Snell RS. <i>Neuroanatomía clínica</i>. 7.ª ed. Wolters Kluwer / Lippincott Williams & Wilkins; 2010.'},
  {key:'nolte', full:'Nolte J. <i>El cerebro humano: introducción a su anatomía funcional</i>. 6.ª ed. Elsevier / Mosby; 2010.'},
  {key:'afifi', full:'Afifi AK, Bergman RA. <i>Neuroanatomía funcional: texto y atlas</i>. 2.ª ed. McGraw-Hill; 2006.'},
  {key:'bear', full:'Bear MF, Connors BW, Paradiso MA. <i>Neurociencia: la exploración del cerebro</i>. 4.ª ed. Wolters Kluwer; 2016.'},
  {key:'crossman', full:'Crossman AR, Neary D. <i>Neuroanatomía: texto y atlas en color</i>. 5.ª ed. Elsevier; 2015.'},

];
/* Qué manuales cubren cada sistema anatómico (cat de STRUCTURES). */
const CAT_SOURCES = {
  corteza:['kandel','purves','bear','nolte'],
  giros:['snell','nolte','crossman'],
  ganglios:['kandel','purves','afifi'],
  talamo:['kandel','snell','nolte'],

  tronco:['snell','nolte','afifi','haines'],

  pares:['snell','nolte','crossman','haines'],
  endocrino:['kandel','purves','bear'],
  meninges:['snell','nolte','crossman','afifi'],
  ventriculos:['snell','nolte','crossman','haines'],

};

const mapaState={expanded:new Set(), query:'', activeCat:null, zoom:1, W:0, H:0, sel:null};
const mapaInner=document.getElementById('mapaInner');
const mapaStage=document.getElementById('mapaStage');
const mapaCanvas=document.getElementById('mapaCanvas');
const mapaSide=document.getElementById('mapaSide');
const mapaFiltersEl=document.getElementById('mapaFilters');
const mapaNorm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const edgePath=(x1,y1,x2,y2)=>{const dx=(x2-x1)*0.5;return `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;};

function applyMapaZoom(){
  const z=mapaState.zoom;
  mapaInner.style.width=mapaState.W+'px'; mapaInner.style.height=mapaState.H+'px';
  mapaInner.style.transform='scale('+z+')';
  mapaStage.style.width=(mapaState.W*z)+'px'; mapaStage.style.height=(mapaState.H*z)+'px';
  const zr=document.getElementById('mapaZoomReset'); if(zr)zr.textContent=Math.round(z*100)+'%';
}
function setMapaZoom(z){ mapaState.zoom=Math.min(1.8,Math.max(0.4,z)); applyMapaZoom(); }

function renderMapa(){
  const q=mapaNorm(mapaState.query);
  const ROW_H=58, TOP=30;
  const X={root:20, sys:250, struct:540}, W={root:150, sys:210, struct:250};
  let slot=0, svgPaths='', nodesHTML='', totalVisible=0;
  const rootCenters=[];
  Object.keys(CATS).forEach(catKey=>{
    if(mapaState.activeCat && mapaState.activeCat!==catKey) return;
    let structs=STRUCTURES.filter(s=>s.cat===catKey);
    if(q) structs=structs.filter(s=>mapaNorm(s.name).includes(q)||mapaNorm(s.def).includes(q)||mapaNorm(s.fun).includes(q));
    if(!structs.length) return;
    totalVisible+=structs.length;
    const col=CATS[catKey].color;
    const expanded=mapaState.expanded.has(catKey)||!!q;
    let sysY;
    if(expanded){
      const ys=[];
      structs.forEach(s=>{
        const y=slot*ROW_H+ROW_H/2; slot++; ys.push(y);
        const region=REGIONS[s.region3d]?REGIONS[s.region3d].label:regionName(s.region3d);
        const sel=mapaState.sel===s.id?' sel':'';
        nodesHTML+=`<div class="mnode struct${sel}" data-id="${s.id}" style="left:${X.struct}px;top:${TOP+y}px;width:${W.struct}px;border-left-color:${col}">
          <div class="mtitle">${s.name}</div><div class="msub">${region}</div></div>`;
      });
      sysY=(ys[0]+ys[ys.length-1])/2;
      ys.forEach(y=>{ svgPaths+=`<path d="${edgePath(X.sys+W.sys, TOP+sysY, X.struct, TOP+y)}" stroke="${hexa(col,.45)}"/>`; });
    } else {
      sysY=slot*ROW_H+ROW_H/2; slot++;
    }
    rootCenters.push({y:sysY,col});
    nodesHTML+=`<div class="mnode system" data-cat="${catKey}" style="left:${X.sys}px;top:${TOP+sysY}px;width:${W.sys}px;border-color:${hexa(col,.55)}">
      <div class="mrow"><span class="caret">${expanded?'▾':'▸'}</span><span class="cdot" style="background:${col}"></span><span class="mtitle">${CATS[catKey].label}</span></div>
      <div class="msub">${structs.length} estructura(s)</div></div>`;
  });
  if(!rootCenters.length){
    mapaState.W=400; mapaState.H=200; applyMapaZoom();
    mapaInner.innerHTML=`<div style="padding:46px 30px;color:var(--muted2);font-size:14px">Sin resultados para “${mapaState.query}”.</div>`;
    return;
  }
  const rootY=(rootCenters[0].y+rootCenters[rootCenters.length-1].y)/2;
  rootCenters.forEach(rc=>{ svgPaths+=`<path d="${edgePath(X.root+W.root, TOP+rootY, X.sys, TOP+rc.y)}" stroke="${hexa(rc.col,.4)}"/>`; });
  nodesHTML+=`<div class="mnode root" data-root="1" style="left:${X.root}px;top:${TOP+rootY}px;width:${W.root}px">
    <div class="mtitle">🧠 Cerebro</div><div class="msub">${totalVisible} estructura(s)</div></div>`;
  const contentW=X.struct+W.struct+30, contentH=Math.max(slot,1)*ROW_H+TOP*2;
  mapaState.W=contentW; mapaState.H=contentH;
  mapaInner.innerHTML=`<svg class="mapaEdges" width="${contentW}" height="${contentH}" viewBox="0 0 ${contentW} ${contentH}">${svgPaths}</svg>${nodesHTML}`;
  applyMapaZoom();
}

function srcList(keys){return `<ul class="biblio">${(keys||[]).map(k=>{const s=SOURCES.find(x=>x.key===k);return s?`<li>${s.full}</li>`:'';}).join('')}</ul>`;}

function renderMapaSideDefault(){
  mapaState.sel=null;
  mapaInner.querySelectorAll('.mnode.struct.sel').forEach(n=>n.classList.remove('sel'));
  mapaSide.innerHTML=`
    <h3>🗺️ Mapa mental del cerebro</h3>
    <p class="sideLede">Explora las <b>${STRUCTURES.length} estructuras</b> agrupadas por sistema. Haz clic en un sistema para desplegar sus estructuras, y en una estructura para ver su ficha y sus fuentes. Arrastra para desplazarte y usa el zoom.</p>
    <div class="mapaSrc">
      <div class="l">📚 Bibliografía de referencia</div>
      <ol class="biblio">${SOURCES.map(s=>`<li>${s.full}</li>`).join('')}</ol>
      <p class="srcNote">Herramienta educativa. Las definiciones, funciones y efectos de lesión se basan en estos manuales de referencia de neuroanatomía y neurociencia; no proceden de una única fuente citada dato a dato. Contrasta siempre con tu bibliografía oficial.</p>
    </div>`;
}

function showMapaDetail(id){
  const s=STRUCTURES.find(x=>x.id===id); if(!s)return;
  mapaState.sel=id;
  mapaInner.querySelectorAll('.mnode.struct').forEach(n=>n.classList.toggle('sel',n.dataset.id===id));
  const col=CATS[s.cat].color;
  const has3d=!!REGIONS[s.region3d];
  mapaSide.innerHTML=`
    <span class="catbadge" style="background:${hexa(col,.18)};color:${col}">${CATS[s.cat].label}</span>
    <h3 style="color:${col}">${s.name}</h3>
    <div class="fblock"><div class="l">📍 Qué es</div><p>${s.def}</p></div>
    <div class="fblock"><div class="l">⚙️ Función</div><p>${s.fun}</p></div>
    <div class="fblock les"><div class="l">⚠️ Si se lesiona…</div><p>${s.les}</p></div>
    <div class="mapaSrc">
      <div class="l">📚 Fuentes de este sistema</div>
      ${srcList(CAT_SOURCES[s.cat])}
      <p class="srcNote">Manuales de referencia que cubren “${CATS[s.cat].label}”. Consulta la bibliografía completa para las ediciones.</p>
    </div>
    <div class="mapaSideActions">
      ${has3d?`<button class="btn sm primary" id="mapaTo3D">🧠 Ver en 3D</button>`:`<span style="color:var(--muted2);font-size:12px">Estructura periférica (sin 3D)</span>`}
      <button class="btn sm" id="mapaAllSrc">📚 Toda la bibliografía</button>
    </div>`;
  const b=mapaSide.querySelector('#mapaTo3D'); if(b)b.onclick=()=>{document.querySelector('.tab[data-view="stage"]').click();selectStructure(id,true);};
  const a=mapaSide.querySelector('#mapaAllSrc'); if(a)a.onclick=renderMapaSideDefault;
}

function buildMapaFilters(){
  mapaFiltersEl.innerHTML=Object.keys(CATS).map(k=>`<button class="fchip" data-c="${k}"><span class="d" style="background:${CATS[k].color}"></span>${CATS[k].label.split(' y ')[0]}</button>`).join('');
  mapaFiltersEl.querySelectorAll('.fchip').forEach(ch=>{
    ch.onclick=()=>{ const k=ch.dataset.c; mapaState.activeCat=mapaState.activeCat===k?null:k; updateMapaChips(); renderMapa(); };
  });
  updateMapaChips();
}
function updateMapaChips(){
  mapaFiltersEl.querySelectorAll('.fchip').forEach(ch=>{
    const on=mapaState.activeCat===ch.dataset.c;
    ch.classList.toggle('on',on);
    ch.style.background=on?hexa(CATS[ch.dataset.c].color,.9):'';
    ch.style.color=on?'#0b1020':'';
    ch.style.borderColor=on?'transparent':'';
  });
}

/* interacción: clic en nodos */
let panMoved=false;
mapaInner.addEventListener('click',e=>{
  if(panMoved){panMoved=false;return;}
  const sys=e.target.closest('.mnode.system');
  if(sys){ const k=sys.dataset.cat; if(mapaState.expanded.has(k))mapaState.expanded.delete(k); else mapaState.expanded.add(k); renderMapa(); return; }
  const st=e.target.closest('.mnode.struct');
  if(st){ showMapaDetail(st.dataset.id); return; }
  const rt=e.target.closest('.mnode.root');
  if(rt){ const keys=Object.keys(CATS); const all=keys.every(k=>mapaState.expanded.has(k)); if(all)mapaState.expanded.clear(); else keys.forEach(k=>mapaState.expanded.add(k)); renderMapa(); }
});

/* pan arrastrando */
let panning=false,panSX=0,panSY=0,panL=0,panT=0;
mapaCanvas.addEventListener('mousedown',e=>{ if(e.button!==0)return; panning=true; panMoved=false; panSX=e.clientX; panSY=e.clientY; panL=mapaCanvas.scrollLeft; panT=mapaCanvas.scrollTop; });
window.addEventListener('mousemove',e=>{ if(!panning)return; const dx=e.clientX-panSX,dy=e.clientY-panSY; if(Math.abs(dx)>4||Math.abs(dy)>4){panMoved=true;mapaCanvas.classList.add('grabbing');} mapaCanvas.scrollLeft=panL-dx; mapaCanvas.scrollTop=panT-dy; });
window.addEventListener('mouseup',()=>{ panning=false; mapaCanvas.classList.remove('grabbing'); });
mapaCanvas.addEventListener('wheel',e=>{ if(!e.ctrlKey)return; e.preventDefault(); setMapaZoom(mapaState.zoom*(e.deltaY<0?1.1:0.9)); },{passive:false});

/* toolbar */
document.getElementById('mapaSearch').addEventListener('input',e=>{ mapaState.query=e.target.value; renderMapa(); });
document.getElementById('mapaExpand').onclick=()=>{ Object.keys(CATS).forEach(k=>mapaState.expanded.add(k)); renderMapa(); };
document.getElementById('mapaCollapse').onclick=()=>{ mapaState.expanded.clear(); renderMapa(); };
document.getElementById('mapaZoomIn').onclick=()=>setMapaZoom(mapaState.zoom*1.15);
document.getElementById('mapaZoomOut').onclick=()=>setMapaZoom(mapaState.zoom*0.87);
document.getElementById('mapaZoomReset').onclick=()=>setMapaZoom(1);

buildMapaFilters();
renderMapaSideDefault();
renderMapa();

/* ============================================================
   QUIZ (generador dinámico)
   ============================================================ */
const quizEl=document.getElementById('quiz');
let quizCfg={n:15, cat:null}, order=[], qi=0, score=0, answered=false, wrongLog=[];

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(arr,n,exclude){const pool=arr.filter(x=>x!==exclude);return shuffle(pool).slice(0,n);}

function renderSetup(){
  quizEl.innerHTML=`
  <div class="qCard setup">
    <h2>📝 Pon a prueba tu neuroanatomía</h2>
    <p class="lede">Preguntas generadas a partir de las <b>${STRUCTURES.length} estructuras</b> de tu temario: función, definición, lesión y sistema. Cada intento baraja preguntas y opciones.</p>
    <div class="field"><span>¿Cuántas preguntas?</span>
      <div class="pills" id="pN">
        ${[10,15,25,40].map(n=>`<button class="pill${n===quizCfg.n?' on':''}" data-n="${n}">${n}</button>`).join('')}
        <button class="pill${quizCfg.n==='all'?' on':''}" data-n="all">Maratón (todas)</button>
      </div></div>
    <div class="field"><span>¿Qué sistema quieres repasar?</span>
      <div class="pills" id="pC">
        <button class="pill${!quizCfg.cat?' on':''}" data-c="">Todos</button>
        ${Object.keys(CATS).map(k=>`<button class="pill${quizCfg.cat===k?' on':''}" data-c="${k}">${CATS[k].label.split(' y ')[0]}</button>`).join('')}
      </div></div>
    <button class="btn primary startBtn" id="startQuiz">Empezar quiz →</button>
  </div>`;
  quizEl.querySelector('#pN').onclick=e=>{const b=e.target.closest('.pill');if(!b)return;
    quizCfg.n=b.dataset.n==='all'?'all':parseInt(b.dataset.n);renderSetup();};
  quizEl.querySelector('#pC').onclick=e=>{const b=e.target.closest('.pill');if(!b)return;
    quizCfg.cat=b.dataset.c||null;renderSetup();};
  quizEl.querySelector('#startQuiz').onclick=startQuiz;
}

function makeQuestion(s, pool){
  const type=shuffle(['fun','def','les','cat'])[0];
  const sameCat=pool.filter(x=>x.cat===s.cat && x.id!==s.id);
  const others=sameCat.length>=3?sameCat:pool.filter(x=>x.id!==s.id);
  if(type==='cat'){
    const wrongCats=sample(Object.keys(CATS).filter(k=>k!==s.cat),3);
    const opts=shuffle([{t:CATS[s.cat].label,ok:true},...wrongCats.map(k=>({t:CATS[k].label,ok:false}))]);
    return {type:'Sistema', q:`¿A qué sistema pertenece <span class="hl">${s.name}</span>?`, opts, ex:`${s.name} pertenece a: ${CATS[s.cat].label}.`};
  }
  if(type==='def'){
    const opts=shuffle([{t:s.name,ok:true},...sample(others,3).map(x=>({t:x.name,ok:false}))]);
    return {type:'Identifica la estructura', q:`¿Qué estructura corresponde a esta descripción?<br><i style="color:var(--muted);font-weight:500">«${s.def}»</i>`, opts, ex:`Es <b>${s.name}</b>. ${s.fun}`};
  }
  const field=type==='fun'?'fun':'les';
  const label=type==='fun'?'función principal':'consecuencia de una lesión';
  const opts=shuffle([{t:s[field],ok:true},...sample(others,3).map(x=>({t:x[field],ok:false}))]);
  return {type: type==='fun'?'Función':'Lesión', q:`¿Cuál es la <span class="hl">${label}</span> de <span class="hl">${s.name}</span>?`, opts, ex:`Correcto: ${s[field]}`};
}
function startQuiz(){
  let pool=STRUCTURES.filter(s=> quizCfg.cat? s.cat===quizCfg.cat : true);
  const n=quizCfg.n==='all'?pool.length:Math.min(quizCfg.n,pool.length);
  const chosen=shuffle(pool).slice(0,n);
  order=chosen.map(s=>makeQuestion(s,pool));
  qi=0;score=0;answered=false;wrongLog=[];
  renderQuestion();
}
function renderQuestion(){
  const it=order[qi], pct=Math.round((qi/order.length)*100), L=['A','B','C','D'];
  quizEl.innerHTML=`
  <div class="qCard">
    <div class="quizTop"><span class="qcount">Pregunta ${qi+1} de ${order.length}</span><span class="qscore">Aciertos: ${score}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="qtype">${it.type}</div>
    <div class="question">${it.q}</div>
    <div class="options" id="opts">
      ${it.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="mk">${L[i]}</span><span>${o.t}</span></button>`).join('')}
    </div>
    <div class="explain" id="explain"></div>
    <div class="quizNav" id="nav"><button class="btn" id="quit">✕ Salir</button><span></span></div>
  </div>`;
  answered=false;
  quizEl.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(parseInt(b.dataset.i)));
  quizEl.querySelector('#quit').onclick=renderSetup;
}
function answer(i){
  if(answered)return; answered=true;
  const it=order[qi], opts=quizEl.querySelectorAll('.opt');
  opts.forEach(o=>o.disabled=true);
  const ci=it.opts.findIndex(o=>o.ok);
  opts[ci].classList.add('correct');
  const ok=it.opts[i].ok;
  if(ok)score++; else {opts[i].classList.add('wrong'); wrongLog.push(it);}
  quizEl.querySelector('.qscore').textContent='Aciertos: '+score;
  const ex=quizEl.querySelector('#explain'); ex.className='explain show '+(ok?'ok':'no');
  ex.innerHTML=(ok?'✅ <b>¡Correcto!</b> ':'❌ <b>Incorrecto.</b> ')+it.ex;
  const nav=quizEl.querySelector('#nav'); nav.innerHTML='<button class="btn" id="quit">✕ Salir</button>';
  nav.querySelector('#quit').onclick=renderSetup;
  const last=qi===order.length-1;
  const nb=document.createElement('button'); nb.className='btn primary'; nb.textContent=last?'Ver resultado →':'Siguiente →';
  nb.onclick=()=>{if(last)showResult();else{qi++;renderQuestion();}};
  nav.appendChild(nb);
}
function showResult(){
  const total=order.length, pct=Math.round(score/total*100);
  let emo,msg;
  if(pct===100){emo='🏆';msg='¡Perfecto! Dominas el temario.';}
  else if(pct>=80){emo='🎉';msg='¡Excelente! Un repaso de los fallos y listo.';}
  else if(pct>=60){emo='👏';msg='Buen nivel. Revisa las estructuras marcadas abajo.';}
  else if(pct>=40){emo='📚';msg='Vas avanzando. Explora el 3D y vuelve a intentarlo.';}
  else{emo='💪';msg='A repasar en el modo 3D: cada estructura tiene su ficha.';}
  quizEl.innerHTML=`
  <div class="qCard result">
    <div style="font-size:50px">${emo}</div>
    <div class="big">${score} / ${total}</div>
    <p style="color:var(--muted)"><b>${pct}% de aciertos.</b><br>${msg}</p>
    ${wrongLog.length?`<div class="review"><div style="font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted2);margin-bottom:4px">Para repasar (${wrongLog.length})</div>
      ${wrongLog.map(w=>`<div class="ri">${w.ex}</div>`).join('')}</div>`:''}
    <div style="display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap">
      <button class="btn primary" id="again">🔁 Nuevo quiz</button>
      <button class="btn" id="toBrain">🧠 Volver al 3D</button>
    </div>
  </div>`;
  quizEl.querySelector('#again').onclick=renderSetup;
  quizEl.querySelector('#toBrain').onclick=()=>document.querySelector('.tab[data-view="stage"]').click();
}
renderSetup();

try{ initScene(); }catch(err){ console.error(err); showLoadError(); }
function showLoadError(){
  const s=document.getElementById('spin'); if(s)s.style.display='none';
  document.getElementById('ovTitle').textContent='No se pudo cargar el motor 3D';
  document.getElementById('ovText').innerHTML='Necesitas conexión a internet para descargar Three.js. El Quiz y el Atlas funcionan igual: cambia de pestaña.';
}
setTimeout(()=>{if(!booted)showLoadError();},8000);
</script>
